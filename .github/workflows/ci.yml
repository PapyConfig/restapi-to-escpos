name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=escpos_api --cov-report=term-missing --cov-fail-under=90
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test 'tests/js/*.test.mjs'

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: escpos-api:ci

      - name: Smoke test (starts, healthy, auth enforced, renders)
        run: |
          docker run -d --name api -p 8000:8000 \
            -e API_KEY=ci -e PRINTER_HOST=127.0.0.1 -e UI_ENABLED=true escpos-api:ci
          for i in $(seq 1 30); do
            curl -fsS localhost:8000/health && break
            sleep 1
          done
          curl -fsS localhost:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/v1/print)" = 401
          curl -fsS -H 'X-API-Key: ci' -H 'Content-Type: application/json' \
            --data-binary @examples/full-receipt.json localhost:8000/v1/render -o out.bin
          test -s out.bin
          curl -fsS -D headers.txt localhost:8000/ui/ -o /dev/null
          grep -qi "content-security-policy: default-src 'none'" headers.txt
          curl -fsS localhost:8000/ui/app.js -o /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-API-Key: ci' \
            -H 'Origin: https://evil.example' -H 'Content-Type: application/json' \
            --data-binary @examples/receipt.json localhost:8000/v1/render)" = 403
          test "$(docker inspect --format '{{.Config.User}}' escpos-api:ci)" = app

      - name: Container logs
        if: always()
        run: docker logs api || true

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
